<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IT Inventory System</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            background: #1e293b; 
            padding: 35px 30px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            text-align: center; 
            border: 1px solid #334155;
        }
        h2 { margin-top: 0; margin-bottom: 20px; color: #38bdf8; font-size: 22px; }
        .tabs { display: flex; margin-bottom: 25px; border-bottom: 1px solid #334155; }
        .tab { 
            flex: 1; 
            padding: 10px; 
            cursor: pointer; 
            color: #94a3b8; 
            font-weight: 600; 
            font-size: 14px; 
            transition: 0.2s;
        }
        .tab.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #cbd5e1; font-weight: 500; }
        input { 
            width: 100%; 
            padding: 10px 12px; 
            border-radius: 6px; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: white; 
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        button { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 14px;
            cursor: pointer; 
            margin-top: 10px; 
            transition: background 0.2s; 
        }
        .btn-primary { background: #0284c7; color: white; }
        .btn-primary:hover { background: #0369a1; }
        .btn-bio { 
            background: #10b981; 
            color: white; 
            margin-top: 15px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
        }
        .btn-bio:hover { background: #059669; }
        .alert { 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 13px; 
            margin-bottom: 15px; 
            display: none; 
        }
        .alert-error { background: #7f1d1d; color: #fca5a5; }
        .alert-success { background: #064e3b; color: #6ee7b7; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>🔒 IT System Access</h2>
        
        <div id="alertBox" class="alert"></div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Sign In</div>
            <div class="tab" onclick="switchTab('register')">Create Account</div>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="login_username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login_password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary">Sign In with Password</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" style="display: none;">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg_fullname" placeholder="Ex: Tech Support Lead">
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg_username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg_password" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn-primary">Create Account</button>
        </form>
    </div>

    <script>
        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerText = msg;
            alertBox.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
            alertBox.style.display = 'block';
        }

        function switchTab(type) {
            document.getElementById('alertBox').style.display = 'none';
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(type === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
            }
        }

        // Handle Password Login Submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/login/password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('login_username').value,
                    password: document.getElementById('login_password').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                window.location.href = '/';
            } else {
                showAlert(data.message || 'Login failed.');
            }
        });

        // Handle User Registration Submission
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    full_name: document.getElementById('reg_fullname').value,
                    username: document.getElementById('reg_username').value,
                    password: document.getElementById('reg_password').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                showAlert(data.message, true);
                document.getElementById('registerForm').reset();
                setTimeout(() => switchTab('login'), 1200);
            } else {
                showAlert(data.message || 'Registration failed.');
            }
        });
    </script>
</body>
</html>
