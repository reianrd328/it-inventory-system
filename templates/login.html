<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IT Inventory System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #1e293b; padding: 35px 30px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; border: 1px solid #334155; }
        h2 { margin-top: 0; margin-bottom: 20px; color: #38bdf8; font-size: 22px; }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 13px; margin-bottom: 6px; color: #cbd5e1; }
        input { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #0284c7; color: white; margin-top: 10px; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔒 IT System Sign In</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="login_username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login_password" required>
            </div>
            <button type="submit">Sign In</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/login/password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('login_username').value,
                    password: document.getElementById('login_password').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                window.location.href = '/';
            } else {
                alert(data.message || 'Login failed.');
            }
        });
    </script>
</body>
</html>
