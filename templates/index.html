<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IT Inventory System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        h2 { margin-bottom: 20px; color: #38bdf8; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 13px; margin-bottom: 5px; color: #94a3b8; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn-primary { background: #0284c7; color: white; }
        .btn-primary:hover { background: #0369a1; }
        .btn-bio { background: #10b981; color: white; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-bio:hover { background: #059669; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #334155; }
        .tab { flex: 1; padding: 10px; cursor: pointer; color: #94a3b8; font-weight: bold; }
        .tab.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center;" class="no-print">
    <h2>🖥️ IT Inventory & Checking System</h2>
    <a href="/logout" style="background: #dc3545; color: white; padding: 8px 15px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 13px;">Logout 🚪</a>
</div>
    <div class="login-card">
        <h2>🔒 IT System Access</h2>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Login</div>
            <div class="tab" onclick="switchTab('register')">Create Account</div>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="login_username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login_password" required>
            </div>
            <button type="submit" class="btn-primary">Sign In with Password</button>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="registerForm" style="display: none;">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg_fullname">
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg_username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg_password" required>
            </div>
            <button type="submit" class="btn-primary">Register Account</button>
        </form>
    </div>

    <script>
        function switchTab(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if(type === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
            }
        }

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/login/password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('login_username').value,
                    password: document.getElementById('login_password').value
                })
            });
            const data = await res.json();
            if(res.ok) {
                window.location.href = '/';
            } else {
                alert(data.message);
            }
        });

        // Handle Registration
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    full_name: document.getElementById('reg_fullname').value,
                    username: document.getElementById('reg_username').value,
                    password: document.getElementById('reg_password').value
                })
            });
            const data = await res.json();
            alert(data.message);
            if(res.ok) switchTab('login');
        });
    </script>
</body>
</html>
